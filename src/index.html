  <!-- Inter carries body copy; Space Grotesk is the display face for the
       wordmark, section titles and app names. Both in one request so there is
       a single round trip. Space Grotesk has no 800 — the heaviest is 700, and
       asking for more would synthesise faux-bold (same trap Inter's missing
       900 caused). -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >
