<div class="landing" [class.is-intro]="introOn()">
  <!-- Shared site navbar. Renders sign-in or the user menu on its own, so the
       landing page below is public to everyone — this is the marketing
       surface, not a gated dashboard. -->
  <app-nav></app-nav>

  <!-- The app directory, as a factory tour. Scrolling walks the line and parks at the pit, where every app is listed. -->
  <app-factory [intro]="introOn()" (introDone)="introOn.set(false)"></app-factory>

  <!-- Music — the landing already fetches this profile and polls now-playing;
       before this it was fetched and never rendered. -->
  <section class="music-snapshot-section" id="music" #musicSection *ngIf="hasMusicData">
    <div class="section-header">
      <span class="section-eyebrow">// On Repeat</span>
      <h2 class="section-title">What's playing</h2>
      <p class="section-subtitle">Recent listening, straight out of Xomify.</p>
    </div>
    <app-music-snapshot
      [profile]="landingTickerProfile"
      [nowPlayingState]="nowPlayingState"
    ></app-music-snapshot>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="assets/img/xomware-icon.webp" alt="Xomware" class="footer-logo" />
        <div class="footer-brand-text">
          <span class="footer-name">XOMWARE</span>
          <a href="https://dominickgiordano.com" target="_blank" rel="noopener" class="footer-credit">Built by Dominick Giordano</a>
        </div>
      </div>
      <div class="footer-links">
        <a href="https://github.com/Xomware/xomware-frontend/issues/new" target="_blank" rel="noopener" class="footer-link">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" fill="currentColor"/></svg>
          Report an issue
        </a>
        <a routerLink="/privacy" class="footer-link">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" fill="currentColor"/></svg>
          Privacy
        </a>
      </div>
      <div class="footer-bottom">
        <span class="footer-copy">&copy; 2026 Xomware. All rights reserved.</span>
      </div>
    </div>
  </footer>
</div>
