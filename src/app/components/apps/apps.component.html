<div class="apps-page">
  <!-- Page-level sky, shared with the landing and /music. -->
  <app-space-backdrop></app-space-backdrop>

  <!-- Shared site navbar — always-scrolled so the solid background is immediate
       (no tall hero here, transparent nav would make links unreadable at the top) -->
  <app-nav [alwaysScrolled]="true"></app-nav>

  <!-- Hero / page title -->
  <header class="apps-hero">
    <div class="apps-hero-inner">
      <span class="section-eyebrow">// The Suite</span>
      <h1 class="apps-hero-title">Apps by Xomware</h1>
      <p class="apps-hero-subtitle">Products &amp; projects from the Xomware workshop.</p>
    </div>
  </header>

  <!-- The suite as an orbital system: one product at the front at a time,
       magnified with its details. The grid below stays the complete,
       scannable directory — this is the showpiece, that is the reference. -->
  <app-orbit></app-orbit>

  <main class="apps-section" aria-label="App directory">
    <app-directory></app-directory>
  </main>

  <!-- Footer -->
  <footer class="apps-footer">
    <div class="apps-footer-inner">
      <span class="apps-footer-copy">&copy; 2026 Xomware. All rights reserved.</span>
      <a routerLink="/privacy" class="apps-footer-link">Privacy</a>
    </div>
  </footer>
</div>
