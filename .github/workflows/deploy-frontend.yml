name: Deploy Xomware Frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Xomware/github-actions/.github/workflows/deploy-frontend-s3.yml@feature/deploy-frontend-s3
    with:
      app: xomware
      node-version: '18'
      ssm: |
        COGNITO_USER_POOL_ID=/xomware/shared/cognito/user-pool-id
        COGNITO_CLIENT_ID=/xomware/shared/cognito/clients/xomware-com-id
        COGNITO_DOMAIN=/xomware/shared/cognito/hosted-ui-domain
        FILE_EDITOR_API_URL=/xomware/shared/file-editor-api/url
        USERS_API_URL=/xomware/shared/users-api/url
        AVATARS_CDN_URL=/xomware/shared/avatars/cdn-url
      build-command: |
        f=src/environments/environment.ts
        sed -i "s|cognitoUserPoolId: ''|cognitoUserPoolId: '$COGNITO_USER_POOL_ID'|" $f
        sed -i "s|cognitoClientId: ''|cognitoClientId: '$COGNITO_CLIENT_ID'|" $f
        sed -i "s|cognitoDomain: 'xomware-auth.auth.us-east-1.amazoncognito.com'|cognitoDomain: '$COGNITO_DOMAIN'|" $f
        sed -i "s|apiBaseUrl: 'https://editor-api.xomware.com'|apiBaseUrl: '$FILE_EDITOR_API_URL'|" $f
        sed -i "s|usersApiUrl: 'https://api.xomware.com'|usersApiUrl: '$USERS_API_URL'|" $f
        sed -i "s|avatarsCdnUrl: ''|avatarsCdnUrl: '$AVATARS_CDN_URL'|" $f
        npm run build:prod
      dist-dir: dist/xomware
      bucket: xomware.com
      domain: xomware.com
